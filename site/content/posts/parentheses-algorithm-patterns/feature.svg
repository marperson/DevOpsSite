<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.4"/>

  <!-- Glowing Ambient Accents -->
  <circle cx="260" cy="190" r="180" fill="#22d3ee" opacity="0.12" filter="blur(60px)"/>
  <circle cx="940" cy="420" r="220" fill="#a78bfa" opacity="0.12" filter="blur(80px)"/>

  <!-- Parentheses Glyph & Title -->
  <text x="110" y="330" fill="#38bdf8" font-family="monospace" font-size="96" font-weight="bold">(&#160;)</text>
  <text x="300" y="315" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700">PARENTHESES</text>
  <text x="300" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="500">ALGORITHM PATTERNS</text>
  <rect x="110" y="400" width="980" height="4" rx="2" fill="url(#glow)"/>
</svg>
