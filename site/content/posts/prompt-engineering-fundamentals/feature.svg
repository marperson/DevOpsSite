<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.4"/>

  <!-- Glowing Ambient Accents -->
  <circle cx="250" cy="200" r="180" fill="#06b6d4" opacity="0.12" filter="blur(60px)"/>
  <circle cx="950" cy="400" r="220" fill="#8b5cf6" opacity="0.12" filter="blur(80px)"/>

  <!-- Prompt Command Symbol & Accent Line -->
  <text x="120" y="320" fill="#38bdf8" font-family="monospace" font-size="72" font-weight="bold">&gt;_</text>
  <text x="240" y="320" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700">PROMPT ENGINEERING</text>
  <rect x="120" y="360" width="960" height="4" rx="2" fill="url(#glow)"/>
</svg>
